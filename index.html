<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    
</head>
<body>
    <h1>Tic-Tac-Toe</h1>
    <p>Click on the grid to place an X or O. The game will automatically switch turns between players.</p>
    <canvas id="board"></canvas>
    <style>
        body {
            background-color: Teal;
            color: White;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            margin: 10px 0;
        }
        p {
            margin: 10px 0;
            font-size: 18px;
        }
        canvas {
            display: block;
            border: 1px solid White;
            margin: auto;
        }
    </style>
    <script src="script.js"></script>
</body>
</html>
